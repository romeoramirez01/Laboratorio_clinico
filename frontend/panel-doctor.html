<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <!-- Titulo de panel -->
  <title>Panel Doctor - Laboratorio Clínico</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- AdminLTE 4 CSS (componentes) -->
  <link href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

</head>
<body data-tema="turquesa">
  <div class="dashboard-container">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
      <div class="container-fluid">
      <a href="#" class="navbar-brand">PANEL DEL DOCTOR</a>
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <span class="avatar-display" id="avatarDisplay">🐼</span>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" id="logoutBtn">Cerrar Sesión <i class="fas fa-sign-out-alt"></i></a>
        </li>
      </ul>
    </div>
  </nav>




    <div class="nav-tabs-custom">
          <div class="d-flex">
            <button class="tab-btn active" data-tab="signos">Signos Vitales</button>
            <button class="tab-btn" data-tab="resultados">Resultados de Exámenes</button>
            <button class="tab-btn" data-tab="historial">Historial Clínico</button>
          </div>
        </div>

        <div class="dashboard-content">

      <!-- Tab Signos Vitales -->
      <div id="tab-signos" class="tab-content active">
        <div class="card">
          <h3>Registrar Signos Vitales</h3>
          <form id="registrarSignosForm">
            <!-- Buscar pacientes -->
            <div class="search-container-modern">
              <input type="text" id="signosDui" class="search-input-modern" placeholder="DUI del Paciente" required>
              <button type="button" id="buscarPacienteSignos" class="btn-search-modern">
                <i class="fas fa-search"></i>
              </button>
            </div>

            <div id="infoPacienteSignos" class="info-paciente"></div>
            <div class="form-row">
              <input type="text" id="presionArterial" placeholder="Presión Arterial (Ej: 120/80)">
              <input type="number" id="frecuenciaCardiaca" placeholder="Frecuencia Cardíaca">
              <input type="number" id="temperatura" placeholder="Temperatura" step="0.1">
            </div>
            <div class="form-row">
              <input type="number" id="peso" placeholder="Peso (kg)" step="0.1">
              <input type="number" id="altura" placeholder="Altura (cm)" step="0.1">
            </div>
            <div class="form-row">
              <textarea id="observaciones" placeholder="Observaciones médicas" rows="3"></textarea>
            </div>

            <button type="submit" class="btn-register-modern">
              <i class="fas fa-notes-medical"></i> Registrar
            </button>
          
          </form>
        </div>       
        <div class="card">

          <h3>Historial de Signos Vitales</h3>
           <div id="historialSignos"></div>
        </div>
        </div>


      
      <!-- Tab Resultados de Exámenes -->
      <div id="tab-resultados" class="tab-content">
        <div class="card">
          <h3>Agregar Resultados de Exámenes</h3>
          <form id="agregarResultadoForm">
          <!-- Buscar paciente resultado -->
        <div class="search-container-modern">
          <input type="text" id="resultadoDui" class="search-input-modern" placeholder="DUI del Paciente" required>
          <button type="button" id="buscarPacienteResultados" class="btn-search-modern">
            <i class="fas fa-search"></i>
          </button>
        </div>

            <div id="infoPacienteResultados" class="info-paciente"></div>
            <div class="form-row">
              <select id="examenSeleccionado" required>
                <option value="">Seleccionar Examen</option>
              </select>
            </div>
            <div class="form-row">
              <textarea id="resultadoTexto" placeholder="Resultados del examen" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn-register-modern">
              <i class="fas fa-notes-medical"></i> Agregar Resultado
            </button>
          
          </form>
        </div>       
        <div class="card">
          
          <h3>Solicitudes de Exámenes Pendientes</h3>
          <div id="solicitudesPendientes"></div>
        </div>
      </div>
      
      <!-- Tab Historial Clínico -->
      <div id="tab-historial" class="tab-content">
        <div class="card">
          <h3>Registrar Historial Clínico</h3>
          <form id="registrarHistorialForm">
            <!-- Buscar historial del paciente  -->
            <div class="search-container-modern">
              <input type="text" id="historialDui" class="search-input-modern" placeholder="DUI del Paciente" required>
              <button type="button" id="buscarPacienteHistorial" class="btn-search-modern">
                <i class="fas fa-search"></i>
              </button>
            </div>

            <div id="infoPacienteHistorial" class="info-paciente"></div>
            <div class="form-row">
              <input type="text" id="enfermedad" placeholder="Enfermedad / Diagnóstico" required>
              <input type="date" id="fechaInicio" required>
            </div>
            <div class="form-row">
              <select id="intensidad" required>
                <option value="">Intensidad</option>
                <option value="Leve">Leve</option>
                <option value="Moderada">Moderada</option>
                <option value="Severa">Severa</option>
                <option value="Crítica">Crítica</option>
              </select>
            </div>
            <div class="form-row">
              <textarea id="factoresAlivio" placeholder="Factores que alivian"></textarea>
              <textarea id="factoresEmpeoran" placeholder="Factores que empeoran"></textarea>
            </div>

            <button type="submit" class="btn-register-modern">
              <i class="fas fa-notes-medical"></i> Registrar
            </button>
          
          </form>
          </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/personalizacion.js"></script>
  <script src="js/panel-doctor.js"></script>
</body>
</html>
