<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Laboratorio Clínico</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body data-tema="turquesa">
  <div class="login-container">
    <div class="login-card">
      <div class="card-header">
        <div id="avatarActual" class="avatar-display">🐼</div>
        <h2>Sistema de Gestión de</h2>
        <h3>Laboratorio Clínico</h3>
      </div>

      <div class="perfil-config">
        <div class="form-group compact">
          <label for="temaColor">Tema</label>
          <select id="temaColor">
            <option value="turquesa">Turquesa</option>
            <option value="azul">Azul</option>
            <option value="morado">Morado</option>
            <option value="naranja">Naranja</option>
            <option value="oscuro">Oscuro</option>
          </select>
        </div>

        <div class="form-group compact">
          <label for="avatarSelect">Avatar</label>
          <select id="avatarSelect">
            <option value="🐼">🐼</option>
            <option value="😺">😺</option>
            <option value="♞">♞</option>
            <option value="🦊">🦊</option>
            <option value="👹">👹</option>
            <option value="☯️">☯️</option>
            <option value="🦁">🦁</option>
          </select>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required placeholder="Ingresa tu correo">
        </div>       
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-container">
            <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
            <button type="button" id="togglePassword" class="toggle-password-btn">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>        
        <button type="submit" class="btn-login">Ingresar</button>        
        <div class="login-links">
          <a href="#" id="forgotPassword">¿Olvidé mi contraseña?</a>
          <a href="#" id="registerLink">Registrate</a>
        </div>
      </form>      
      <div id="message" class="message"></div>
    </div>
  </div>

  <!-- Modal de Registro -->
<div id="registerModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div class="modal-header">
      <div class="modal-icon"></div>
      <h3>Regístrate</h3>
      <p>Regístrate en nuestro laboratorio clínico</p>
    </div>
    <form id="registerForm">
      <!-- Fila 1: DUI + Fecha de Nacimiento -->
      <div class="form-row-modern">
        <div class="input-group">
          <label>DUI</label>
          <input type="text" id="regDui" placeholder="Ej: 12345678-9" required>
        </div>
        <div class="input-group">
          <label>Fecha de Nacimiento</label>
          <input type="date" id="regFechaNacimiento" required>
        </div>
      </div>

      <!-- Fila 2: Nombres + Apellidos -->
      <div class="form-row-modern">
        <div class="input-group">
          <label>Nombres</label>
          <input type="text" id="regNombres" placeholder="Ingresa tus nombres" required>
        </div>
        <div class="input-group">
          <label>Apellidos</label>
          <input type="text" id="regApellidos" placeholder="Ingresa tus apellidos" required>
        </div>
      </div>

      <!-- Fila 3: Teléfono (solo, ocupa toda la fila) -->
      <div class="form-row-single">
        <div class="input-group">
          <label>Teléfono</label>
          <input type="tel" id="regTelefono" placeholder="Ej: 7012-3456" required>
        </div>
      </div>

      <!-- Fila 4: Correo Electrónico + Contraseña -->
      <div class="form-row-modern">
        <div class="input-group">
          <label>Correo Electrónico</label>
          <input type="email" id="regEmail" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <div class="password-container">
            <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required>
            <button type="button" class="toggle-reg-password" onclick="toggleRegPassword()">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Botones -->
      <div class="form-footer">
        <button type="submit" class="btn-register">Registrarse</button>
        <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

  <!-- Modal de Recuperar Contraseña -->
  <div id="forgotModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Recuperar Contraseña</h3>
      <form id="forgotForm">
        <input type="email" id="forgotEmail" placeholder="Ingresa tu correo electrónico" required>
        <button type="submit">Enviar Instrucciones</button>
      </form>
    </div>
  </div>

  <!-- Modal para restablecer contraseña (oculto por defecto) -->
  <div id="resetModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Restablecimiento de Contraseña</h3>
      <form id="resetForm">
        <div class="form-group">
          <label>Nueva Contraseña</label>
          <input type="password" id="resetPassword" required>
        </div>
        <div class="form-group">
          <label>Confirmar Contraseña</label>
          <input type="password" id="confirmResetPassword" required>
        </div>
        <button type="submit" class="btn-login">Generar Contraseña</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/login.js"></script>
</body>
</html>
